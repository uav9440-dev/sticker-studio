name: sticker_studio_ai
description: >-
  Sticker Studio AI — a professional, Arabic-first mobile design studio for
  creating static and animated WhatsApp stickers.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & architecture
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Material You dynamic color
  dynamic_color: ^1.7.0
  google_fonts: ^6.2.1

  # Persistence
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Imaging & export
  image: ^4.2.0            # PNG/JPG/WEBP decode, GIF encode, pixel ops
  image_picker: ^1.1.2
  
  share_plus: ^9.0.0
  flutter_svg: ^2.0.10

  # WhatsApp integration (add sticker packs directly)

  flutter_image_compress: ^2.3.0
  in_app_purchase: ^3.2.0

  # Utilities
  uuid: ^4.4.2
  collection: ^1.18.0
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.2
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true   # gen-l10n for ar / en

