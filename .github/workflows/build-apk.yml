# يبني ملف APK تلقائيًا في السحابة — بدون Android Studio.
# يبني ملف APK تلقائيًا في السحابة — بدون Android Studio.
# ارفع المشروع إلى GitHub وسيعمل هذا تلقائيًا مع كل تحديث.
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}   # زر "Run workflow" لتشغيله يدويًا

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # يولّد مجلد android/ وملفات المنصة إذا لم تكن موجودة
      - name: Generate platform files
        run: flutter create . --platforms android --project-name sticker_studio_ai

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build release APK
        run: flutter build apk --release --obfuscate --split-debug-info=build/symbols

      # صيغة AAB المطلوبة لمتجر Google Play
      - name: Build release AAB
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sticker-studio-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: sticker-studio-ai-aab
          path: build/app/outputs/bundle/release/app-release.aab
